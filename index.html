<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var m=localStorage.getItem('voyager-ui-theme');if(m)document.documentElement.dataset.theme=m;document.documentElement.dataset.look='panel';var sc=localStorage.getItem('voyager-ui-scale')||'auto',w=innerWidth,z=w<=1100?1:sc!=='auto'?Math.min(2,Math.max(.5,sc/100||1)):Math.min(1.6,Math.max(.6,w/1920));if(z!==1)document.documentElement.style.zoom=z}catch(e){}</script>
    <title>Voyager UI</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<div id="app"></div>
